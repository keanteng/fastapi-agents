<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agents API tester</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>Agents API tester</h1>

      <form id="run-form">
        <label>
          Agent
          <select id="agent"></select>
        </label>
        <label>
          Input
          <textarea id="input" rows="4" required></textarea>
        </label>
        <label>
          Max steps (blank = agent default)
          <input id="max-steps" type="number" min="1" max="20" placeholder="auto" />
        </label>
        <div class="row">
          <button id="start" type="submit">Start run</button>
          <button id="cancel" type="button" disabled>Cancel</button>
        </div>
        <div class="row">
          <label class="inline">
            <input id="continue-conv" type="checkbox" checked />
            Continue conversation
          </label>
          <button id="reset-conv" type="button">New conversation</button>
        </div>
      </form>

      <dl class="meta">
        <div><dt>Run ID</dt><dd id="run-id">—</dd></div>
        <div><dt>Status</dt><dd id="status">idle</dd></div>
        <div><dt>Conversation</dt><dd id="conversation">—</dd></div>
      </dl>

      <pre id="log" aria-live="polite"></pre>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
