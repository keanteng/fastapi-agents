<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agents chat</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="drop-overlay" hidden>
      <p>Drop a file to attach it for reading, extraction or a compliance check</p>
    </div>

    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-top">
          <h1>Agents</h1>
          <button id="new-chat" type="button" class="primary">+ New chat</button>
        </div>
        <div class="sidebar-upload">
          <button id="attach" type="button">Attach file</button>
          <span>attach a file and I'll read, extract or check it</span>
        </div>
        <ul id="conversation-list" class="conversation-list"></ul>
      </aside>

      <main class="chat">
        <header class="chat-head">
          <span class="meta-pill">conv <span id="conv-label">none</span></span>
          <span id="status" class="status-idle">idle</span>
          <button id="stop" type="button" hidden>Stop</button>
        </header>

        <section id="messages" aria-live="polite"></section>

        <footer class="composer">
          <form id="composer-form">
            <textarea
              id="composer-input"
              rows="1"
              placeholder="Ask anything — attach a file and I'll decide how to help"
            ></textarea>
            <button id="composer-send" type="submit" class="primary">Send</button>
          </form>
        </footer>
      </main>
    </div>

    <input id="file-input" type="file" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
